<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirby Shop - Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <a class="logo">Kirby Shop</a>
        <nav>
            <a href="registro.html">Mi Cuenta (Login / Registro)</a>
        </nav>
    </header>

    <h2 style="color:rosybrown">Productos</h2>
    <section class="productos">
        <div class="imagentam">
            <div class="contenedor-imagen">
                <img src="kirby-1.jpg" alt="Imagen inicial" class="img-original">
                <img src="kirby2.jpg" alt="Imagen al pasar el cursor" class="img-cambio">
            </div>
            <h3>Kirby (Con diferentes caras) </h3>
            <button class="btn-comprar">$1,265</button>
        </div>
        
        <div class="imagentam">
            <div class="contenedor-imagen">
                <img src="peluche1.avif" alt="Imagen inicial" class="img-original">
                <img src="peluche2.avif" alt="Imagen al pasar el cursor" class="img-cambio">
            </div>
            <h3>Peluche Kirby Pintor</h3>
            <button class="btn-comprar">$549</button>
        </div>
    </section>

    <h2 style="color:rosybrown">Pre-venta</h2>
    <section class="productos">
        <div class="imagentam">
            <div class="contenedor-imagen">
                <img src="preventa1.webp" alt="Imagen inicial" class="img-original">
                <img src="preventa2.webp" alt="Imagen al pasar el cursor" class="img-cambio">
            </div>
            <h3>Amiibo King Dedede</h3>
            <p style="color: #666; margin-bottom: 15px;">Sale el 23 de noviembre</p>
            <button class="btn-comprar">$987</button>
        </div>

        <div class="imagentam">
            <div class="contenedor-imagen">
                <img src="peluche3.webp" alt="Imagen inicial" class="img-original">
                <img src="peluche4.webp" alt="Imagen al pasar el cursor" class="img-cambio">
            </div>
            <h3>Just Toys Mega Peluche Kirby </h3>
            <p style="color: #666; margin-bottom: 15px;">Sale el 27 de noviembre</p>
            <button class="btn-comprar">$799</button>
        </div>
    </section>

    <footer>
        <p> 2026 Kirby Shop - Manuel Hector Muñiz Garcia - 5-I </p>
    </footer>
</body>
</html>
